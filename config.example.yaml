# =============================================================================
# Nox-Wallet Configuration Reference
# =============================================================================
# Copy to config.yaml and fill in your values.
# Struct reference: config/config.go
# =============================================================================

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
app:
  name: "nox-wallet"
  version: "1.0.0"
  environment: "local"      # local, development, staging, production
  shutdown_timeout: 30s

  retry:
    max_retries: 3
    base_delay: 100ms
    max_delay: 5s

# -----------------------------------------------------------------------------
# gRPC Server
# -----------------------------------------------------------------------------
grpc:
  enabled: true
  host: "127.0.0.1"         # localhost only — Flutter connects on the same machine
  port: 50055
  authorization: ""         # optional bearer token for inter-process auth
  reflection: true          # set false in production
  shutdown_timeout: 10s

# -----------------------------------------------------------------------------
# Logger
# -----------------------------------------------------------------------------
logger:
  level: "debug"            # debug, info, warn, error
  format: "json"
  add_source: false
  pretty: true

# -----------------------------------------------------------------------------
# Ethereum
# -----------------------------------------------------------------------------
ethereum:
  # JSON-RPC endpoint — Alchemy recommended for getAssetTransfers support
  # https://dashboard.alchemy.com → create an app → copy HTTPS URL
  http_url: "https://eth-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_KEY"

  # EVM chain ID: 1 = Ethereum mainnet, 11155111 = Sepolia testnet
  chain_id: 1

  # Alchemy API key — same key as in the URLs above
  alchemy_key: "YOUR_ALCHEMY_KEY"

# -----------------------------------------------------------------------------
# Pricefeed (CoinGecko)
# -----------------------------------------------------------------------------
# Anonymous tier rate-limits to ~10–30 req/min, which causes sparkline charts
# to flicker. Sign up at https://www.coingecko.com/en/api/pricing for a free
# Demo plan (~30 req/min, more reliable) or a paid Pro plan, then paste the
# key below. Leave the key empty to fall back to the anonymous tier.
pricefeed:
  coingecko_key: ""
  coingecko_plan: "demo"      # "demo" or "pro"
