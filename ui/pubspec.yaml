name: nox
description: Nox — Ethereum wallet for macOS.
publish_to: none
version: 1.5.0+10500

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # gRPC / Protobuf
  grpc: ^5.1.0
  protobuf: ^6.0.0
  fixnum: ^1.1.0
  wallet_proto:
    path: ../proto/gen/dart

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Desktop notifications (uses macOS UNUserNotificationCenter under the hood)
  flutter_local_notifications: ^19.1.0

  # QR code generation
  qr_flutter: ^4.1.0

  # Desktop window + tray
  window_manager: ^0.3.9
  tray_manager: ^0.2.3

  # Biometric / Touch ID auth
  local_auth: ^2.3.0

  # Utils
  path: ^1.9.0
  decimal: ^3.2.0
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  url_launcher: ^6.3.2

  # Sparkle-backed auto-update (macOS / Windows). See Info.plist
  # (SUFeedURL / SUPublicEDKey) and lib/core/services/update_service.dart.
  auto_updater: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/nox_logo.png
    - assets/images/tray_icon.png
    - assets/images/tray_icon@2x.png
