version: "3"

silent: true

vars:
  UI: ui
  RELEASE_BUNDLE: ui/build/macos/Build/Products/Release/Nox.app

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  # ───────────────────────────────────────────────────────────────────────────
  # Development
  # ───────────────────────────────────────────────────────────────────────────

  dev:
    desc: Build backend → run Flutter on macOS in debug mode (primary dev loop)
    cmds:
      - task: build:backend
      # Flutter's VM service uses `Data/tmp/` inside the sandbox container
      # to create the DevFS scratch dir for hot reload. The container is
      # created lazily by macOS the first time the app writes anything;
      # if `tmp/` doesn't exist yet, `flutter run` crashes with
      # PathNotFoundException. Pre-create it so hot reload always attaches.
      - mkdir -p "$HOME/Library/Containers/com.nox.wallet/Data/tmp"
      - cd {{.UI}} && flutter run -d macos

  # ───────────────────────────────────────────────────────────────────────────
  # Clean — single nuclear wipe (artifacts, caches, sandbox, app, keychain)
  # ───────────────────────────────────────────────────────────────────────────

  clean:
    desc: Wipe everything — builds, caches, sandbox containers, installed app, keychain
    cmds:
      - echo "→ killing live processes"
      - killall -9 Nox backend 2>/dev/null || true
      - diskutil unmount /Volumes/Nox 2>/dev/null || true
      - echo "→ build artefacts"
      - rm -rf build dist
      - rm -rf {{.UI}}/build
      - rm -rf {{.UI}}/.dart_tool
      - rm -rf {{.UI}}/macos/Pods
      - rm -rf {{.UI}}/macos/Flutter/ephemeral
      - rm -f  {{.UI}}/macos/Podfile.lock
      - echo "→ installed app"
      - rm -rf /Applications/Nox.app
      - rm -rf "$HOME/Applications/Nox.app"
      - echo "→ sandbox container data + caches + prefs"
      # macOS containermanagerd owns the container shell and its
      # `.com.apple.containermanagerd.metadata.plist` — even root can't
      # `rm -rf` those without `csrutil disable`. Wipe the user-writable
      # Data/ subtree only; the OS rebuilds the rest on next launch.
      - rm -rf "$HOME/Library/Containers/com.nox.wallet/Data"/* 2>/dev/null || true
      - rm -rf "$HOME/Library/Containers/com.nox.wallet/Data"/.[!.]* 2>/dev/null || true
      # Re-create the tmp/ dir Flutter's VM service needs for hot reload;
      # otherwise the next `task dev` crashes with PathNotFoundException
      # before `flutter run` can attach.
      - mkdir -p "$HOME/Library/Containers/com.nox.wallet/Data/tmp"
      - find "$HOME/Library/Group Containers" -maxdepth 1 -name "*com.nox.wallet*" -exec rm -rf {} + 2>/dev/null || true
      - rm -rf "$HOME/Library/Caches/com.nox.wallet"
      - rm -rf "$HOME/Library/Preferences/com.nox.wallet.plist"
      - rm -rf "$HOME/Library/Saved Application State/com.nox.wallet.savedState"
      - rm -rf "$HOME/Library/HTTPStorages/com.nox.wallet"
      - rm -rf "$HOME/Library/WebKit/com.nox.wallet"
      - rm -rf "$HOME/Library/Application Scripts/com.nox.wallet"
      - echo "→ keychain wallet secret"
      - security delete-generic-password -s "nox-wallet" 2>/dev/null || true
      - echo "→ Launch Services (so Finder forgets old bundles)"
      - /System/Library/Frameworks/CoreServices.framework/Versions/A/Frameworks/LaunchServices.framework/Versions/A/Support/lsregister
        -kill -r -domain user 2>/dev/null || true
      - echo "✓ clean done — system is virgin"

  # ───────────────────────────────────────────────────────────────────────────
  # Build — Go backend, Flutter release bundle, signed DMG
  # ───────────────────────────────────────────────────────────────────────────

  build:backend:
    desc: Build Go backend → ./build/backend (fast iteration target)
    cmds:
      - mkdir -p build
      - CGO_ENABLED=1 GOOS=darwin go build -ldflags="-s -w" -o ./build/backend ./cmd/app
    sources:
      - "**/*.go"
      - go.mod
    generates:
      - build/backend

  build:
    desc: Build Go backend + Flutter release Nox.app
    cmds:
      - task: build:backend
      - cd {{.UI}} && flutter build macos --release

  build:dmg:
    desc: |
      Build Nox.app, ad-hoc-codesign every nested binary, package as DMG, ad-hoc-codesign the DMG.
      Ad-hoc signing keeps the bundle internally consistent (so macOS doesn't gripe about a broken
      seal when the user has Gatekeeper assessment off) but does not satisfy notarization — that
      requires an Apple Developer ID ($99/yr).
    cmds:
      - task: build
      - mkdir -p dist
      - rm -f dist/Nox.dmg
      # Bundle `config.yaml` into Contents/Resources so the backend
      # finds it next to the Flutter executable at runtime
      # (BackendProcess._findConfig looks there first). The file is
      # produced one of two ways:
      #   - CI: `release.yml` runs `envsubst` over
      #     config/config.production.yaml.tmpl with GitHub Secrets,
      #     writing config.yaml to the repo root before this task runs.
      #   - Local dev: you keep your own config.yaml at repo root
      #     (gitignored). `task dev` uses the same file.
      # If config.yaml is missing we'd still produce a DMG, but it'd
      # be a black-screened brick at first launch — fail loudly here
      # instead.
      - |
        if [ ! -f config.yaml ]; then
          echo "::error::config.yaml is missing — render from config/config.production.yaml.tmpl (CI) or copy config.example.yaml (local)" >&2
          exit 1
        fi
        cp config.yaml "{{.RELEASE_BUNDLE}}/Contents/Resources/config.yaml"
      # Re-sign the bundle ad-hoc with --deep so every nested framework
      # / dylib carries a signature, AND covers the config.yaml we
      # just copied in (otherwise the Gatekeeper "seal" mismatches the
      # added file). Flutter does this during --release, but re-signing
      # here defends against any post-build copy that would otherwise
      # break the seal.
      - codesign --force --deep --sign - "{{.RELEASE_BUNDLE}}"
      - |
        create-dmg \
          --volname "Nox" \
          --volicon "ui/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" \
          --background "ui/macos/installer/background@2x.png" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Nox.app" 150 185 \
          --hide-extension "Nox.app" \
          --app-drop-link 450 185 \
          "dist/Nox.dmg" \
          "{{.RELEASE_BUNDLE}}"
      - codesign --force --sign - dist/Nox.dmg
      - echo "✓ dist/Nox.dmg ready"

  # ───────────────────────────────────────────────────────────────────────────
  # Quality — individual gates + the meta `prepare` runner
  # ───────────────────────────────────────────────────────────────────────────

  test:
    desc: Run Go tests
    cmds:
      - CGO_ENABLED=1 go test ./...

  lint:
    desc: golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix

  flutter:analyze:
    desc: Flutter / Dart static analyzer
    dir: "{{.UI}}"
    cmds:
      - flutter analyze

  flutter:format:
    desc: Format Dart sources in-place (line length 100)
    dir: "{{.UI}}"
    cmds:
      - dart format --line-length=100 lib/

  prepare:
    desc: Full pre-commit pipeline (deps + dryrun + lint + test + format + analyze + flutter test)
    cmds:
      - go mod tidy
      - go mod vendor
      - go build ./...
      - golangci-lint run --fix
      - CGO_ENABLED=1 go test ./...
      - cd {{.UI}} && dart format --line-length=100 --set-exit-if-changed lib/
      - cd {{.UI}} && flutter analyze
      - |
        if [ -d "{{.UI}}/test" ] && [ -n "$(ls -A {{.UI}}/test 2>/dev/null)" ]; then
          cd {{.UI}} && flutter test
        fi

  # ───────────────────────────────────────────────────────────────────────────
  # Version — single source of truth in /VERSION, kept in sync across
  # pubspec.yaml and config.example.yaml. The auto-tag GitHub Action
  # validates this sync on every push to master.
  # ───────────────────────────────────────────────────────────────────────────

  version:
    desc: Print the current version
    silent: true
    cmds:
      - tr -d '[:space:]' < VERSION
      - echo

  version:set:
    desc: |
      Set the version across VERSION, pubspec.yaml, and config.example.yaml.
      Usage: task version:set -- 0.2.0
    silent: true
    requires:
      vars: [CLI_ARGS]
    cmds:
      - |
        set -euo pipefail
        new="{{.CLI_ARGS}}"
        if ! echo "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "✗ '$new' is not valid semver (MAJOR.MINOR.PATCH)"; exit 1
        fi
        # Build number: monotonic integer derived from semver — required
        # by Sparkle, which compares appcast `sparkle:version` against
        # the bundle's `CFBundleVersion` (build number) — NOT against
        # the marketing `CFBundleShortVersionString`. If the build
        # number doesn't strictly increase between releases, the update
        # dialog shows "You're up to date" even when a newer marketing
        # version is published. Formula: MAJOR*10000 + MINOR*100 + PATCH
        # (good as long as MINOR < 100 and PATCH < 100).
        IFS='.' read -r maj min pat <<< "$new"
        build_number=$((maj * 10000 + min * 100 + pat))
        echo "$new" > VERSION
        sed -i.bak -E "s/^version:[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$/version: $new+$build_number/" {{.UI}}/pubspec.yaml && rm {{.UI}}/pubspec.yaml.bak
        sed -i.bak -E "s/^  version: \"[0-9]+\.[0-9]+\.[0-9]+\"$/  version: \"$new\"/" config.example.yaml && rm config.example.yaml.bak
        echo "✓ version set to $new (build $build_number)"
        echo "  VERSION             — $(tr -d '[:space:]' < VERSION)"
        echo "  pubspec.yaml        — $(grep '^version:' {{.UI}}/pubspec.yaml)"
        echo "  config.example.yaml — $(grep '^  version:' config.example.yaml)"

  # ───────────────────────────────────────────────────────────────────────────
  # Proto — buf in Docker (one-time image build, then format + lint + generate)
  # ───────────────────────────────────────────────────────────────────────────

  proto:image:
    desc: Build the buf Docker image (run once after pulling the repo)
    cmds:
      - docker build -f gen.Dockerfile -t nox-wallet-buf:latest .

  proto:generate:
    desc: Format, lint, and regenerate Go + Dart proto bindings
    cmds:
      - |
        docker run --rm -v "$(pwd):/workspace" -w /workspace \
          nox-wallet-buf:latest format -w
      - |
        docker run --rm -v "$(pwd):/workspace" -w /workspace \
          nox-wallet-buf:latest lint
      - |
        docker run --rm -v "$(pwd):/workspace" -w /workspace \
          nox-wallet-buf:latest generate

  # ───────────────────────────────────────────────────────────────────────────
  # Token list — refresh the embedded Uniswap Default List snapshot
  # ───────────────────────────────────────────────────────────────────────────

  update:tokenlist:
    desc: Fetch the latest Uniswap Default Token List, validate, commit-ready
    cmds:
      # Stage 1 — download to a temp file so a network failure doesn't
      # corrupt the committed copy.
      - curl -fsSL https://tokens.uniswap.org -o config/networks/tokenlist_uniswap.json.new
      # Stage 2 — sanity-check the JSON shape (must have name + non-empty tokens array).
      - |
        jq -e '.name and (.tokens | length > 100)' \
          config/networks/tokenlist_uniswap.json.new > /dev/null \
          || { echo "✗ downloaded file failed validation"; rm -f config/networks/tokenlist_uniswap.json.new; exit 1; }
      # Stage 3 — atomic swap.
      - mv config/networks/tokenlist_uniswap.json.new config/networks/tokenlist_uniswap.json
      - |
        echo "✓ token list updated"
        echo "  name:    $(jq -r .name config/networks/tokenlist_uniswap.json)"
        echo "  version: $(jq -r '.version | "\(.major).\(.minor).\(.patch)"' config/networks/tokenlist_uniswap.json)"
        echo "  tokens:  $(jq '.tokens | length' config/networks/tokenlist_uniswap.json)"
        echo "  mainnet: $(jq '[.tokens[] | select(.chainId == 1)] | length' config/networks/tokenlist_uniswap.json)"
        echo
        echo "→ run 'task prepare' to verify, then commit the diff"
