# Dependency / vulnerability sweep.
#
# Two triggers:
#   - weekly cron (Monday 06:00 UTC) catches CVEs disclosed in our
#     dependencies without us having to push anything;
#   - manual `workflow_dispatch` lets us re-run on demand after
#     bumping a vendored module or pinning a Dart constraint.
#
# Why Linux runner: this job touches no platform-specific tooling
# (govulncheck and osv-scanner are pure-Go binaries; the dart audit
# only needs `pubspec.lock`). Linux minutes are 10× cheaper than
# macOS on private repos.
name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulncheck:
    name: Go vulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck is Google's official scanner for known
      # vulnerabilities in Go modules. Unlike generic SCA tools it
      # walks the actual call graph and only flags issues that are
      # reachable from our code — fewer false positives.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  dependency-audit:
    name: Dependency audit (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner reads every dependency manifest in the repo
      # (go.mod, pubspec.lock, vendor/modules.txt) and cross-checks
      # against the OSV database. Catches things govulncheck can't —
      # specifically the Dart/Flutter side.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  flutter-outdated:
    name: Flutter outdated
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # `flutter pub outdated` flags Dart packages where a newer
      # major exists. Doesn't fail the job — it's a heads-up, not a
      # gate. Result is in the run log; CVE-actionable findings
      # surface through osv-scanner above.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: pub outdated
        working-directory: ui
        run: flutter pub outdated --no-dev-dependencies --json || true
